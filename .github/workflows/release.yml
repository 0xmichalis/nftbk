name: Release

# Build the server image from a version tag, sign it, and publish it to GHCR as
# `<tag>` and, while the tag is main's head, `latest`. Then cut a GitHub Release
# with generated notes.
#   git tag v0.2.0 && git push origin v0.2.0
# auto-tag.yml dispatches this workflow whenever the version in Cargo.toml
# changes on main, so tags are normally not pushed by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

# Least privilege: each job asks for exactly what it needs below.
permissions:
  contents: read

env:
  # Resolved once. On workflow_dispatch github.ref_name is the branch the
  # workflow was dispatched from ("main"), not the tag being released.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  docker:
    # Shared with ci.yml so an older run cannot move latest after a newer one.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
      # Keep a pending release queued instead of letting a newer run cancel it.
      queue: max
    permissions:
      contents: read
      packages: write
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-docker-publish.yml@f9c06aba6da39eb3c4b5d50583653a4437fa03dd
    with:
      image: ghcr.io/${{ github.repository_owner }}/nftbk-server
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      signing-password: ${{ secrets.COSIGN_PASSWORD }}

  release:
    name: Publish Release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
        make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
        generate_release_notes: true
        body: |
          Docker image: `${{ needs.docker.outputs.image }}`
