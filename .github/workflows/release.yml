name: Release

# Build the server image from a version tag, sign it, and publish it to GHCR as
# `<tag>` and, while the tag is main's head, `latest`. Then cut a GitHub Release
# with generated notes.
#   git tag v0.2.0 && git push origin v0.2.0
# auto-tag.yml dispatches this workflow whenever the version in Cargo.toml
# changes on main, so tags are normally not pushed by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

# Least privilege: each job asks for exactly what it needs below.
permissions:
  contents: read

env:
  # Resolved once. On workflow_dispatch github.ref_name is the branch the
  # workflow was dispatched from ("main"), not the tag being released.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nftbk-server

jobs:
  docker:
    name: Build, Sign and Push Docker Image
    runs-on: ubuntu-latest
    # Shared with ci.yml so an older run cannot move latest after a newer one.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
      # Keep a pending release queued instead of letting a newer run cancel it.
      queue: max
    permissions:
      contents: read
      packages: write # push to GHCR

    steps:
    # A tag name may legally contain shell metacharacters, and it reaches several
    # `run:` scripts below. Reject anything that is not a plain version tag before
    # it is used, and pass it through env rather than `${{ }}` interpolation.
    - name: Validate release tag
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
          echo "refusing to release a tag that is not vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
          exit 1
        fi

    # On a tag push this is the tag; on workflow_dispatch it must be stated
    # explicitly, or checkout would silently build the default branch and
    # publish it under the tag's name.
    #
    # persist-credentials: false keeps the token out of .git/config; the Docker
    # build context would otherwise be able to read it.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.RELEASE_TAG }}
        persist-credentials: false

    # The tag is the release's identity, so the code it points at must agree.
    - name: Check Cargo.toml version matches the tag
      run: |
        set -euo pipefail
        VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
        if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
          echo "Cargo.toml version v$VERSION does not match tag $RELEASE_TAG" >&2
          exit 1
        fi

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: |
        set -euo pipefail
        GIT_COMMIT=$(git rev-parse --short HEAD)
        docker build --pull \
          --build-arg GIT_COMMIT="$GIT_COMMIT" \
          -t "$IMAGE_NAME:$RELEASE_TAG" \
          .

    - name: Push release tag
      id: push
      run: |
        set -euo pipefail
        digest=$(docker push "$IMAGE_NAME:$RELEASE_TAG" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p')
        test -n "$digest"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # Verifiers use cosign v2, which reads this signature format.
        cosign-release: v2.6.5

    - name: Sign image
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
      run: |
        cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE"
        cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
        cosign verify --key "$RUNNER_TEMP/cosign.pub" "$IMAGE" > /dev/null

    # latest only ever points at a signed digest of main's newest commit.
    - name: Publish latest
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
      run: |
        main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
        test -n "$main_sha"
        if [ "$main_sha" != "$(git rev-parse HEAD)" ]; then
          echo "::notice::$RELEASE_TAG is not main's head; leaving latest unchanged."
          exit 0
        fi
        docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE"

  release:
    name: Publish Release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        draft: false
        generate_release_notes: true
        body: |
          Docker image: `${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}`
