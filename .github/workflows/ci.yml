name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "53 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions. Each is cached by version as a standalone binary, so
  # bumping a version here is the only thing that triggers a reinstall.
  CARGO_SORT_VERSION: "2.0.1"
  SQLX_CLI_VERSION: "0.8.6"
  CARGO_TARPAULIN_VERSION: "0.33.0"
  CARGO_DENY_VERSION: "0.19.8"
  CARGO_VET_VERSION: "0.10.2"

jobs:
  fmt:
    name: Check Format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo-sort binary
      id: cache-cargo-sort
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-sort
        key: cargo-sort-bin-${{ env.CARGO_SORT_VERSION }}

    - name: Add cargo-sort to PATH
      run: echo "${{ runner.tool_cache }}/cargo-sort/bin" >> "$GITHUB_PATH"

    - name: Install cargo-sort
      if: steps.cache-cargo-sort.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-sort" --version ${{ env.CARGO_SORT_VERSION }} --locked cargo-sort

    - name: Check Format
      run: cargo fmt --all -- --check

    - name: Check cargo sort
      run: cargo sort --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:
    name: Check Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.3.0
      with:
        dockerfile: "Dockerfile"

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@v20

  sqlx:
    name: Check SQLx Cache
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache sqlx-cli binary
      id: cache-sqlx-cli
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/sqlx-cli
        key: sqlx-cli-bin-${{ env.SQLX_CLI_VERSION }}

    - name: Add sqlx-cli to PATH
      run: echo "${{ runner.tool_cache }}/sqlx-cli/bin" >> "$GITHUB_PATH"

    - name: Install sqlx-cli
      if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/sqlx-cli" --version ${{ env.SQLX_CLI_VERSION }} --locked sqlx-cli

    - name: Check SQLx cache
      run: cargo sqlx prepare --check

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo registry and git
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo-deny binary
      id: cache-cargo-deny
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-deny
        key: cargo-deny-bin-${{ env.CARGO_DENY_VERSION }}

    - name: Add cargo-deny to PATH
      run: echo "${{ runner.tool_cache }}/cargo-deny/bin" >> "$GITHUB_PATH"

    - name: Install cargo-deny
      if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-deny" --version ${{ env.CARGO_DENY_VERSION }} --locked cargo-deny

    # Advisories are owned by the scheduled security-audit.yml workflow
    # (+ .cargo/audit.toml) to keep the RUSTSEC ignore list in one place;
    # cargo-deny covers licenses/bans/sources.
    - name: Run cargo deny
      run: cargo deny check bans licenses sources

  vet:
    name: Cargo Vet
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo registry and git
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo-vet binary
      id: cache-cargo-vet
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-vet
        key: cargo-vet-bin-${{ env.CARGO_VET_VERSION }}

    - name: Add cargo-vet to PATH
      run: echo "${{ runner.tool_cache }}/cargo-vet/bin" >> "$GITHUB_PATH"

    - name: Install cargo-vet
      if: steps.cache-cargo-vet.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-vet" --version ${{ env.CARGO_VET_VERSION }} --locked cargo-vet

    - name: Run cargo vet
      run: cargo vet --locked

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nftbk
          POSTGRES_PASSWORD: nftbk
          POSTGRES_DB: nftbk_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nftbk -d nftbk_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo-tarpaulin binary
      id: cache-cargo-tarpaulin
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/cargo-tarpaulin
        key: cargo-tarpaulin-bin-${{ env.CARGO_TARPAULIN_VERSION }}

    - name: Add cargo-tarpaulin to PATH
      run: echo "${{ runner.tool_cache }}/cargo-tarpaulin/bin" >> "$GITHUB_PATH"

    - name: Install cargo-tarpaulin
      if: steps.cache-cargo-tarpaulin.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-tarpaulin" --version ${{ env.CARGO_TARPAULIN_VERSION }} --locked cargo-tarpaulin

    - name: Run tests with coverage
      run: |
        cargo tarpaulin \
          --workspace \
          --all-features \
          --ignore-tests \
          --engine llvm \
          --skip-clean \
          --timeout 120 \
          --out Lcov \
          --output-dir .

    - name: Validate PostgreSQL migration and API lifecycles
      env:
        NFTBK_INTEGRATION_DATABASE_URL: postgres://nftbk:nftbk@localhost:5432/nftbk_v2
        SQLX_OFFLINE: "true"
      run: cargo test --test api_v2_postgres -- --ignored

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      continue-on-error: true

  docker-publish:
    name: Build, Sign and Push Docker Image
    runs-on: ubuntu-latest
    needs: [fmt, clippy, lint, sqlx, deny, vet, test]
    if: github.ref == 'refs/heads/main' # Only run on main branch
    # Shared with release.yml so an older run cannot move latest after a newer one.
    concurrency:
      group: publish-latest
      cancel-in-progress: false

    permissions:
      packages: write # Required for GHCR push
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nftbk-server

    steps:
    # This job holds the image signing key, so its actions are pinned.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full clone to ensure git history is available
        persist-credentials: false

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: |
        GIT_COMMIT=$(git rev-parse --short HEAD)
        docker build --pull --build-arg GIT_COMMIT="$GIT_COMMIT" -t "$IMAGE_NAME:sha-$GITHUB_SHA" .

    - name: Push commit tag
      id: push
      run: |
        set -o pipefail
        digest=$(docker push "$IMAGE_NAME:sha-$GITHUB_SHA" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p')
        test -n "$digest"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # Verifiers use cosign v2, which reads this signature format.
        cosign-release: v2.6.5

    - name: Sign image
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
      run: |
        cosign sign --yes --recursive --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE"
        cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
        cosign verify --insecure-ignore-tlog=true --key "$RUNNER_TEMP/cosign.pub" "$IMAGE" > /dev/null

    # latest only ever points at a signed digest of main's newest commit.
    - name: Publish latest
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
      run: |
        if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
          echo "::notice::main has moved past $GITHUB_SHA; leaving latest to the newer run."
          exit 0
        fi
        docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE"
