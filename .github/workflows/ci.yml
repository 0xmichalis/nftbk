name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "53 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions. Each is cached by version as a standalone binary, so
  # bumping a version here is the only thing that triggers a reinstall.
  SQLX_CLI_VERSION: "0.8.6"
  CARGO_TARPAULIN_VERSION: "0.33.0"
  CARGO_VET_VERSION: "0.10.2"

jobs:
  checks:
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-ci.yml@657d4c30746413b9a6d4e18a76665b8b4dbd6eb1
    with:
      run-tests: false

  markdownlint:
    uses: 0xmichalis/repo-tooling/.github/workflows/markdownlint.yml@657d4c30746413b9a6d4e18a76665b8b4dbd6eb1

  lint:
    uses: 0xmichalis/repo-tooling/.github/workflows/dockerfile-lint.yml@657d4c30746413b9a6d4e18a76665b8b4dbd6eb1

  sqlx:
    name: Check SQLx Cache
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache sqlx-cli binary
      id: cache-sqlx-cli
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/sqlx-cli
        key: sqlx-cli-bin-${{ env.SQLX_CLI_VERSION }}

    - name: Add sqlx-cli to PATH
      run: echo "${{ runner.tool_cache }}/sqlx-cli/bin" >> "$GITHUB_PATH"

    - name: Install sqlx-cli
      if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/sqlx-cli" --version ${{ env.SQLX_CLI_VERSION }} --locked sqlx-cli

    - name: Check SQLx cache
      run: cargo sqlx prepare --check

  vet:
    name: Cargo Vet
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache cargo registry and git
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo-vet binary
      id: cache-cargo-vet
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/cargo-vet
        key: cargo-vet-bin-${{ env.CARGO_VET_VERSION }}

    - name: Add cargo-vet to PATH
      run: echo "${{ runner.tool_cache }}/cargo-vet/bin" >> "$GITHUB_PATH"

    - name: Install cargo-vet
      if: steps.cache-cargo-vet.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-vet" --version ${{ env.CARGO_VET_VERSION }} --locked cargo-vet

    - name: Run cargo vet
      run: cargo vet --locked

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nftbk
          POSTGRES_PASSWORD: nftbk
          POSTGRES_DB: nftbk_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nftbk -d nftbk_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustup show

    - name: Cache build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo-tarpaulin binary
      id: cache-cargo-tarpaulin
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/cargo-tarpaulin
        key: cargo-tarpaulin-bin-${{ env.CARGO_TARPAULIN_VERSION }}

    - name: Add cargo-tarpaulin to PATH
      run: echo "${{ runner.tool_cache }}/cargo-tarpaulin/bin" >> "$GITHUB_PATH"

    - name: Install cargo-tarpaulin
      if: steps.cache-cargo-tarpaulin.outputs.cache-hit != 'true'
      run: cargo install --root "${{ runner.tool_cache }}/cargo-tarpaulin" --version ${{ env.CARGO_TARPAULIN_VERSION }} --locked cargo-tarpaulin

    - name: Run tests with coverage
      run: |
        cargo tarpaulin \
          --workspace \
          --all-features \
          --ignore-tests \
          --engine llvm \
          --skip-clean \
          --timeout 120 \
          --out Lcov \
          --output-dir .

    - name: Validate PostgreSQL migration and API lifecycles
      env:
        NFTBK_INTEGRATION_DATABASE_URL: postgres://nftbk:nftbk@localhost:5432/nftbk_v2
        SQLX_OFFLINE: "true"
      run: cargo test --test api_v2_postgres -- --ignored

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      continue-on-error: true

  docker-publish:
    name: Build, Sign and Push Docker Image
    runs-on: ubuntu-latest
    needs: [checks, markdownlint, lint, sqlx, vet, test]
    if: github.ref == 'refs/heads/main' # Only run on main branch
    # Shared with release.yml so an older run cannot move latest after a newer one.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
      # Keep a pending release queued instead of letting a newer run cancel it.
      queue: max

    permissions:
      packages: write # Required for GHCR push
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nftbk-server

    steps:
    # This job holds the image signing key, so its actions are pinned.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full clone to ensure git history is available
        persist-credentials: false

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: |
        GIT_COMMIT=$(git rev-parse --short HEAD)
        docker build --pull --build-arg GIT_COMMIT="$GIT_COMMIT" -t "$IMAGE_NAME:sha-$GITHUB_SHA" .

    # latest only ever points at a signed digest of main's newest commit.
    - name: Publish signed image
      id: push
      uses: 0xmichalis/repo-tooling/actions/publish-image@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
      with:
        image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
        signing-password: ${{ secrets.COSIGN_PASSWORD }}
        token: ${{ github.token }}
