# Unified Configuration File for nftbk
# This file combines chains, authentication, and IPFS provider configurations

# Chain configurations (RPC endpoints)
[chains]
"eip155:42161" = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"eip155:8453" = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"eip155:1" = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"eip155:10" = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"eip155:137" = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"eip155:360" = "https://shape-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
"tezos:NetXdQprcVkpaWU" = "https://mainnet.smartpy.io"
"eip155:7777777" = "https://zora-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# JWT authentication credentials
[[jwt]]
issuer = "privy.io"
# Expected audience - your app id if using Privy
audience = "youraudience"
# Use \n to encode newlines if storing on one line (e.g. in env files)
verification_key = "-----BEGIN PUBLIC KEY-----\nPK/AAAAAAAAAAAAAA==\n-----END PUBLIC KEY-----"

# x402 payment configuration
[x402]
# Currency to accept payments with; only USDC support for now
asset_symbol = "USDC"
# Base URL for protected resources—this is included in 402 responses and
# should change to a proper domain in production.
base_url = "https://localhost:8080/"
# Recipient of x402 payments
recipient_address = "0xYourRecipientAddress"
# Maximum time allowed for payment completion
max_timeout_seconds = 300

[x402.pricing]
# Archive price per gigabyte (USDC, decimal string)
archive_price_per_gb = "0.05"
# IPFS pinning price per gigabyte (USDC, decimal string)
pin_price_per_gb = "0.2"

# Check https://www.x402.org/ecosystem?category=facilitators for more facilitator options
[x402.facilitator]
url = "https://x402.org/facilitator"
network = "eip155:84532"

