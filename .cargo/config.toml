# libtest's `--report-time` (prints per-test wall time next to `ok`) is
# nightly-gated, and the gate is a runtime check on `RUSTC_BOOTSTRAP` inside the
# test harness. `runner` prefixes every binary cargo launches (`cargo test`,
# `run`, `bench`, examples) but never rustc itself — the alternative (`[env]`)
# would also reach rustc, which flips every crate's fingerprint and silently
# unlocks `#![feature(..)]` on stable. `env` is not a Windows binary, so this
# stays scoped to unix.
[target.'cfg(unix)']
runner = ["env", "RUSTC_BOOTSTRAP=1"]

# Dependency cooldown: resolution skips crate versions published less than
# 7 days ago unless Cargo.lock already has them. To take one early, such as
# a security fix, lock it explicitly; this also admits any too-new
# dependencies it needs, so review the "published N days ago" lines:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
# A plain `cargo update` drops such a version again until it is 7 days old,
# so update other crates with `-p` meanwhile.
[registry]
global-min-publish-age = "7 days"
